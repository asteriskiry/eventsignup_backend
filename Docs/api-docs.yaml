            - COOKIE
            - URL
            - SSL
        responseCharacterEncoding:
          type: string
        requestCharacterEncoding:
          type: string
        defaultSessionTrackingModes:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - COOKIE
            - URL
            - SSL
    ServletRegistration:
      type: object
      properties:
        mappings:
          type: array
          items:
            type: string
        runAsRole:
          type: string
        name:
          type: string
        className:
          type: string
        initParameters:
          type: object
          additionalProperties:
            type: string
    SessionCookieConfig:
      type: object
      properties:
        domain:
          type: string
        name:
          type: string
        path:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        comment:
          type: string
          deprecated: true
        secure:
          type: boolean
        httpOnly:
          type: boolean
        maxAge:
          type: integer
          format: int32
    TaglibDescriptor:
      type: object
      properties:
        taglibURI:
          type: string
        taglibLocation:
          type: string
    UsersEvents:
      type: object
      properties:
        myEvents:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
        myForms:
          type: array
          items:
            $ref: '#/components/schemas/FormDto'
    EventsDto:
      type: object
      properties:
        myEvents:
          $ref: '#/components/schemas/MyEvents'
        myForms:
          $ref: '#/components/schemas/MyForms'
    MyEvents:
      type: object
      properties:
        newEvents:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
        upcomingEvents:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
        pastEvents:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
    MyForms:
      type: object
