        className:
          type: string
        initParameters:
          type: object
          additionalProperties:
            type: string
    HttpStatusCode:
      type: object
      properties:
        error:
          type: boolean
        is4xxClientError:
          type: boolean
        is5xxServerError:
          type: boolean
        is1xxInformational:
          type: boolean
        is3xxRedirection:
          type: boolean
        is2xxSuccessful:
          type: boolean
    JspConfigDescriptor:
      type: object
      properties:
        taglibs:
          type: array
          items:
