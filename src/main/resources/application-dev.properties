fi.asteriski.config.event.root-path-bannerimg=/tmp/
fi.asteriski.config.security.allowed-cors-domain=http://localhost:5173

# DB config
spring.jpa.show-sql=true

# OpenApi
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=false
#Auth
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/realms/asteriski
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/realms/asteriski/protocol/openid-connect/certs
